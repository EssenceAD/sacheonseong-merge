#loading.off{opacity:0; pointer-events:none}
#loading div{display:flex; flex-direction:column; align-items:center; gap:14px}
#loading b{font-size:26px; letter-spacing:.12em}
#loading span{font-size:14px}
#loading i{display:block; width:132px; height:8px; border:2px solid #1B1714; position:relative; overflow:hidden}
#loading i::after{content:""; position:absolute; inset:0; background:#1B1714; transform-origin:left; animation:ldbar 1s ease-in-out infinite alternate}
@keyframes ldbar{from{transform:scaleX(.06)}to{transform:scaleX(1)}}

body{margin:0; font-size:14px}
[hidden]{display:none!important}

<title>사천성 머지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&text=0123456789%C3%97%3A%2C%2B%2F&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* 바랜 양피지 위의 손 채색 목판화: 화면마다 목판 테두리 한 장, 정보는 최소. */
:root{
  --paper:#DAD2BE; /* 바랜 양피지 */
  --face:#F3ECD8;  /* 패·단추의 밝은 종이 */
  --ink:#1B1714;   /* 먹선 */
  --gold:#E2B437; --gold-l:#F7E391; --gold-d:#A8781A; /* 금박: 5단계 패와 매칭·폭발 전용 */
  --seal:#DB3A1C;  /* 낙관 도장 */
  --blue:#2443B0;  /* 도감 채색 테 */
  --display:"Cormorant Garamond","IM Fell English","Gowun Batang","Nanum Myeongjo","Batang",serif; /* 영문·숫자 IM Fell, 한글 고운바탕 */
  --num:"Cormorant Garamond","IM Fell English","Gowun Batang",serif; /* 점수·시간·단계 번호 */
  --cw:40px; --ch:50px; --mg:12px;
}
.num, .stats b, #mapGrid button, #menu nav small, #recList dd, #resTable td:not(:first-child){font-family:var(--num); font-variant-numeric:lining-nums tabular-nums; font-weight:700; font-style:normal}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--display); font-variant-numeric:lining-nums;
  overflow:hidden; touch-action:manipulation; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#sheet{
  position:relative; height:100%; max-width:520px; margin:0 auto; box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:6px; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
#grain{position:fixed; inset:0; pointer-events:none; z-index:0}
#sheet > *{position:relative; z-index:1}
.screen{width:100%; flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px}
.screen[hidden], #result[hidden], #basket[hidden]{display:none}
#game{gap:6px; justify-content:flex-start}
#game #boardWrap{margin-block:auto}
.boardBox:empty{display:none}
#result button{font-size:17px; padding:10px 18px}
#result button.primary{background:var(--ink); color:var(--face)}
#result #resMsg{font-size:17px; font-weight:700; line-height:1.5; white-space:pre-line}

/* 목판 테두리 */
.frame{
  box-sizing:border-box; border:2.5px solid var(--ink); outline:1.3px solid var(--ink); outline-offset:-8px; padding:22px 20px;
  background:
    radial-gradient(circle at 0 0, var(--ink) 0 11px, transparent 11.6px),
    radial-gradient(circle at 100% 0, var(--ink) 0 11px, transparent 11.6px),
    radial-gradient(circle at 0 100%, var(--ink) 0 11px, transparent 11.6px),
    radial-gradient(circle at 100% 100%, var(--ink) 0 11px, transparent 11.6px),
    var(--face);
}
h1{font-size:38px; font-weight:700; margin:0; letter-spacing:.08em; text-wrap:balance; text-align:center}
h2{font-size:22px; font-weight:700; margin:0; letter-spacing:.1em}
.sub{margin:0; font-style:italic; font-size:17px; letter-spacing:.06em}
.pic{display:block; width:44px; height:55px; background-size:100% 100%; background-repeat:no-repeat}
.picrow{display:flex; gap:4px; justify-content:center}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}
#press{position:relative; width:min(100%,320px); aspect-ratio:320/300}
#plate,#paper{position:absolute; inset:0; border-radius:3px}
#plate{background:repeating-linear-gradient(92deg,#B98F57 0 7px,#AD844E 7px 9px,#C19964 9px 16px); box-shadow:0 0 0 2px var(--ink), 4px 5px 0 var(--ink)}
#plate svg,#paper svg{position:absolute; inset:0; width:100%; height:100%}
#plate .dry{opacity:.3}
#plate .wet{clip-path:inset(0 100% 0 0)}
#paper{background:var(--face); box-shadow:0 0 0 2px var(--ink), 3px 4px 0 var(--ink); opacity:0}
#paper .pl{opacity:0}
#roller{position:absolute; top:-7%; height:114%; width:9%; left:-16%; border-radius:7px; box-shadow:0 0 0 1.5px var(--ink);
  background:linear-gradient(90deg,var(--ink) 0,#4B4038 38%,#6A5C50 50%,#4B4038 62%,var(--ink) 100%)}
#roller::after{content:""; position:absolute; left:38%; width:24%; top:-16%; height:16%; background:var(--ink)}
#board.gl .tile{visibility:hidden}

button{
  font:inherit; font-size:15px; color:var(--ink); background:var(--face); border:2px solid var(--ink);
  padding:8px 18px; border-radius:2px; box-shadow:2px 2px 0 var(--ink); cursor:pointer;
}
button:active:not(:disabled){translate:2px 2px; box-shadow:none}
button:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
button:disabled{opacity:.4; cursor:default}
button.plain{border:0; box-shadow:none; background:none; padding:6px 8px; font-size:15px}
button.armed{background:var(--ink); color:var(--face)}

#menu nav{width:min(100%,300px); display:flex; flex-direction:column; gap:12px}
#menu nav button{display:flex; justify-content:space-between; align-items:baseline; font-size:18px; padding:11px 16px}
#menu nav small{font-size:16px; margin-left:auto}
#menu nav button{justify-content:flex-start!important; gap:10px}
#menu nav button::before{content:""; flex:none; width:17px; height:27px; background:url(art/sprig.png) center/contain no-repeat}
.pedi{position:relative; width:min(86%,270px); margin-bottom:-12px; -webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 62%,#000 62%,transparent 100%); mask-image:radial-gradient(ellipse 52% 62% at 50% 62%,#000 62%,transparent 100%)}
.pedi img{position:relative; display:block; width:100%; mix-blend-mode:multiply}
.pedi i{position:absolute; display:block}
.pedi .w1{left:9%; right:9%; top:5%; height:70%; background:#178F84; opacity:.45; border-radius:50% 50% 0 0 / 100% 100% 0 0}
.pedi .w2{left:33%; right:33%; top:36%; bottom:8%; background:#BF7F17; opacity:.6; border-radius:50% 50% 8% 8% / 70% 70% 8% 8%}

.bar{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px}
.note{margin:0; font-size:14px; text-align:center}
#mapGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:9px; width:min(100%,330px)}
#mapGrid button{padding:0; aspect-ratio:1; font-size:20px; box-shadow:none}
#mapGrid button.done{background:var(--ink); color:var(--face)}
#mapGrid button.now{box-shadow:0 0 0 2px var(--face), 0 0 0 4.5px var(--ink); font-weight:700}
#mapGrid button{display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; gap:2px}
#mapGrid .st{font-family:var(--display); font-size:9px; font-weight:400; letter-spacing:0}
#mapGrid button.rest{border-style:dashed}
.pager{display:flex; align-items:center; gap:14px; font-size:16px}
#cxGrid.cx0{border:1.5px dashed var(--ink); background:var(--face)}
#cxGrid.cx1{border:2.5px solid var(--ink); outline:1.3px solid var(--ink); outline-offset:-7px; background:var(--face)}
#cxGrid.cx3{outline:2px solid var(--seal); outline-offset:-9px; box-shadow:inset 0 0 0 12px var(--face), inset 0 0 0 14px var(--blue); padding:24px}
.board{border-collapse:collapse; font-size:14px; margin:4px auto 0}
.board td{padding:2px 7px; text-align:left; white-space:nowrap}
.board td:first-child{font-weight:700}
.boardBox{width:min(100%,300px); min-height:20px}
.boardBox .note{font-size:13px}
#nickDlg{position:absolute!important; inset:0; z-index:40!important; display:flex; align-items:center; justify-content:center}
#nickDlg[hidden]{display:none}
/* 판화 해설 카드: 양피지 바탕에 고운바탕 글씨 */
#note{position:absolute; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; background:rgba(27,23,20,.76); padding:18px; box-sizing:border-box}
#note[hidden]{display:none}
#note article{width:min(100%,330px); max-height:calc(100% - 20px); overflow:hidden; box-sizing:border-box; padding:22px 20px 14px; display:flex; flex-direction:column; gap:10px; color:#2A1F14; font-family:"Gowun Batang","Batang",serif;
  background:radial-gradient(ellipse at 18% 12%,rgba(255,246,214,.75),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(150,105,50,.28),transparent 55%),radial-gradient(ellipse at 90% 8%,rgba(160,115,60,.18),transparent 40%),#E6D2A4;
  border:1.5px solid #5B4326; border-radius:3px 9px 4px 10px; box-shadow:inset 0 0 0 5px rgba(230,210,164,.0), inset 0 0 26px rgba(120,82,36,.35), 5px 7px 0 rgba(27,23,20,.35); animation:ntIn .32s ease-out both; transform-origin:50% 0}
@keyframes ntIn{from{transform:scaleY(.05); opacity:0}to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){#note article{animation:none}}
#note h3{margin:0; font-size:21px; font-weight:700; text-align:center; line-height:1.3; text-wrap:balance}
#ntBy{margin:-4px 0 0; text-align:center; font-size:14px; padding-bottom:9px; border-bottom:1px solid rgba(91,67,38,.55)}
#ntStory{margin:0; font-size:15.5px; line-height:1.62}
#ntFact{display:flex; flex-direction:column; gap:3px; padding:9px 11px; background:rgba(255,248,222,.5); border-left:3px solid #8A3A1E}
#ntFact small{font-size:12px; font-weight:700; color:#8A3A1E; letter-spacing:.04em}
#ntFact span{font-size:14.5px; line-height:1.5}
#note em{font-style:normal; font-size:13px; text-align:center; color:#5B4326; margin-top:2px}
#albIntro{margin:0; font-family:"Gowun Batang","Batang",serif; font-size:13px; line-height:1.5; text-align:center; text-wrap:balance; white-space:pre-line; padding:7px 12px; width:min(100%,330px); box-sizing:border-box; background:#E6D2A4; border:1px solid #5B4326; color:#2A1F14}
#albIntro:empty{display:none}
#albHint{font-size:13.5px; font-weight:700}
#albumGrid figure.has{cursor:pointer}
#nickDlg form{width:min(88%,280px); display:flex; flex-direction:column; gap:14px; align-items:center}
#nickInput{width:100%; box-sizing:border-box; font:inherit; font-size:18px; text-align:center; color:var(--ink); background:var(--face); border:0; border-bottom:2px solid var(--ink); padding:6px; border-radius:0; -webkit-user-select:text; user-select:text}
#nickInput:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
button.primary{background:var(--ink); color:var(--face)}
#menu{gap:10px; justify-content:flex-start; overflow-y:auto; padding-block:4px 8px}
#menu nav{width:min(100%,330px)!important; gap:10px!important}
#menu nav button.big{font-size:21px; padding:13px 16px}
#menu nav button.primary::before{filter:invert(.93)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
#menu .grid2 button{font-size:16px; padding:10px 10px; gap:7px}
#menu .grid2 button::before{width:13px; height:21px}
.paintCard{display:flex; flex-direction:column; gap:6px; width:min(100%,330px); padding:8px 8px 6px; align-items:stretch; flex:none}
.paintCard .cap{display:flex; justify-content:space-between; align-items:baseline; font-size:16px}
.paintCard .cap em{font-style:normal; font-size:14px; border:1.5px solid var(--ink); padding:3px 9px; border-radius:2px}
.paintCard.can .cap em{background:var(--ink); color:var(--face)}
.paintCard .cap b{font-size:18px}
.paintCard.can .cap em{font-weight:700}
.paintCard.can{animation:cardcall 1.6s ease-in-out infinite}
@keyframes cardcall{50%{box-shadow:2px 2px 0 var(--ink), 0 0 0 4px var(--face), 0 0 0 6.5px var(--ink)}}
#menuPaintPic{display:flex; justify-content:center; pointer-events:none}
#menuPaintPic .pt{height:min(29vh,215px); max-width:100%}
.pt{position:relative; background:var(--face); flex:none}
.pt > svg,.pt > img{position:absolute; inset:0; width:100%; height:100%; display:block; max-width:none}
.pt img{pointer-events:none}
#ptStage{width:100%; display:flex; justify-content:center; padding:18px 0}
#setList{width:min(100%,330px); display:flex; flex-direction:column; gap:0; padding:6px 14px}
#setList .row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid rgba(27,23,20,.25)}
#setList .row:last-child{border-bottom:0}
#setList .row div{flex:1; text-align:left}
#setList .row b{display:block; font-size:17px}
#setList .row small{display:block; font-size:12.5px; opacity:.85}
#setList .row button{min-width:64px; font-size:15px; padding:7px 10px}
#setNote{font-size:13px; text-wrap:balance}
#ptHud,#coHud{width:100%; display:flex; align-items:center; gap:12px}
#coHud #coNote{margin:0; flex:1; font-size:14.5px; font-weight:700; line-height:1.35; text-wrap:balance}
#coop{justify-content:flex-start; gap:10px; padding-top:6px}
#coStage{width:100%; display:flex; justify-content:center; padding:6px 0}
.pt.co{box-shadow:0 0 0 2px var(--ink), 4px 5px 0 2px rgba(27,23,20,.25)}
.cc{position:absolute; box-sizing:border-box; display:flex; align-items:flex-end; justify-content:center; padding:0 1px 2px; overflow:hidden; margin:0; min-height:0; border-radius:0}
span.cc{pointer-events:none}
span.cc i{font-style:normal; font-size:10.5px; line-height:1.25; max-width:100%; padding:0 3px; background:var(--face); color:var(--ink); border:1px solid var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
span.cc.me i{background:var(--ink); color:var(--face)}
button.cc{align-items:center; padding:0; background:rgba(243,236,216,.28); border:1.5px dashed rgba(27,23,20,.6); box-shadow:none}
button.cc:active:not(:disabled){translate:0 0; background:rgba(226,180,55,.5)}
button.cc svg{width:17px; height:17px; fill:var(--ink); opacity:.45}
button.cc.can svg{opacity:.95}
#coWho{font-size:13.5px; text-wrap:balance}
#ptHud #ptNote{margin:0; flex:1; font-size:15px; font-weight:700; line-height:1.35; text-wrap:balance}
#ptBtns button{font-size:17px; padding:11px 18px}
.drop{position:absolute; translate:-50% -50%; height:34px; padding:0 9px 0 6px; border-radius:17px; display:flex; align-items:center; justify-content:center; gap:2px; box-shadow:2px 2px 0 var(--ink)}
.drop b{font-family:var(--num); font-variant-numeric:lining-nums; font-size:19px; line-height:1}
.drop svg{width:19px; height:19px; fill:var(--ink); flex:none}
.drop:not(.can){background:var(--paper); box-shadow:none; border-style:dashed}
.drop.can{animation:droppulse 1.2s ease-in-out infinite}
@keyframes droppulse{50%{scale:1.14}}
#ptStage .pt.framed{scale:.86}
.pt.framed{box-shadow:0 0 0 4px var(--face), 0 0 0 6px var(--ink), 0 0 0 16px #9A7445, 0 0 0 18px var(--ink), 7px 9px 0 18px rgba(27,23,20,.28)}
.pt.framed.in{animation:frameIn .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes frameIn{0%{scale:1.14; rotate:-2.5deg; box-shadow:0 0 0 0 var(--face),0 0 0 0 var(--ink),0 0 0 0 #9A7445,0 0 0 0 var(--ink),0 0 0 0 rgba(27,23,20,0)}}
#ptBtns{display:flex; gap:10px; min-height:44px}
#albumGrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 8px; width:100%; overflow-y:auto; align-items:start}
#albumGrid figure{margin:0; display:flex; flex-direction:column; gap:4px; align-items:stretch}
#albumGrid .slot{aspect-ratio:1 / 1; display:flex; align-items:center; justify-content:center}
#albumGrid figcaption{font-size:13px; text-align:center; line-height:1.4; display:flex; flex-direction:column}
#albumGrid figcaption b{font-size:15px}
.pt.lock{border:2px dashed var(--ink); box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:40px; opacity:.75; background:none}
@media (prefers-reduced-motion: reduce){ .paintCard.can,.drop.can,.pt.framed.in{animation:none} }
.tile.seal{filter:saturate(.45)}
.tile.seal::after{content:""; position:absolute; inset:5%; background:linear-gradient(51deg,transparent 43%,var(--ink) 43% 57%,transparent 57%),linear-gradient(-51deg,transparent 43%,var(--ink) 43% 57%,transparent 57%)}
#hud.boss .hc:nth-of-type(1){background:var(--ink); color:var(--face)}
#mapGrid button.boss{border-width:3.5px}
#gallery{width:100%; flex:none}

const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; };

  try{
    if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)();

      bgmBus=ac.createGain(); bgmBus.gain.value=.5; bgmBus.connect(ac.destination);

      bgmIn=ac.createGain(); const dl=ac.createDelay(.5), fb=ac.createGain(), lp=ac.createBiquadFilter(), wet=ac.createGain();

      bgmIn.connect(bgmBus); bgmIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(bgmBus); }
    if(ac.state==='suspended'&&!document.hidden) ac.resume(); return ac;
  }catch(e){ return null; }
}

const DX=[1,0,-1,0], DY=[0,1,0,-1];
const open=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||grid[y][x]===null;
function findPath(a,b){
  const W=COLS+2, best=new Int32Array(W*(ROWS+2)*4).fill(1e9);
  const q=[{x:a.x,y:a.y,d:-1,t:0,n:0,p:null}]; let hit=null;
  for(let i=0;i<q.length;i++){
    const s=q[i]; if(hit&&s.t*1000+s.n>=hit.t*1000+hit.n) continue;
    for(let nd=0;nd<4;nd++){
      if(s.d>=0&&nd===(s.d+2)%4) continue;
      const t=s.d<0?0:s.t+(nd!==s.d?1:0); if(t>2) continue;
      const x=s.x+DX[nd], y=s.y+DY[nd];
      if(x<-1||y<-1||x>COLS||y>ROWS) continue;
      const ns={x,y,d:nd,t,n:s.n+1,p:s}, c=t*1000+ns.n;
      if(x===b.x&&y===b.y){ if(!hit||c<hit.t*1000+hit.n) hit=ns; continue; }
      if(!open(x,y)) continue;
      const key=((y+1)*W+x+1)*4+nd; if(best[key]<=c) continue; best[key]=c; q.push(ns);
    }
  }
  if(!hit) return null;
  const pts=[]; for(let s=hit;s;s=s.p) pts.push({x:s.x,y:s.y}); pts.reverse();
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){ const p=pts[i-1],c=pts[i],n=pts[i+1]; if(c.x-p.x!==n.x-c.x||c.y-p.y!==n.y-c.y) out.push(c); }
  out.push(pts[pts.length-1]); return out;
}
function findMove(){
  const by={};
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const g=grid[y][x]; if(g&&!g.rock&&!g.down&&!g.seal)(by[g.k*10+g.l]||(by[g.k*10+g.l]=[])).push({x,y}); }
  for(const key of shuffle(Object.keys(by))){ const a=by[key];
    for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++) if(findPath(a[i],a[j])) return [a[i],a[j]]; }
  return null;
}

// 종류별 장수 → [1단계,2단계,3단계] 장수. 어느 조합이든 끝까지 합치면 5단계 두 장이 남아 터진다
const SETS={11:[4,0,7],12:[4,2,6],13:[4,4,5],14:[4,6,4],15:[4,8,3],16:[8,4,4]};
function deal(cfg,rng){
  const pos=[]; for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)pos.push({x,y}); shuffle(pos,rng);
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  let n=0; const put=(c,o)=>{ for(let j=0;j<c;j++){ const p=pos[n++]; grid[p.y][p.x]=Object.assign({rock:true},o); } };
  put(cfg.wall,{type:'wall'}); put(cfg.stone,{type:'stone',hp:2}); put(cfg.bramble,{type:'bramble'}); put(cfg.blot||0,{type:'blot'});
  const bag=genBag(COLS*ROWS-n,rng,cfg.seal?3:-1);
  const spots=pos.slice(n); let tries=0;
  do{ shuffle(bag,rng); bag.forEach(t=>{ t.down=false; t.seal=false; });
    let d=cfg.down||0, sl=cfg.seal||0; // 뒤집힌 패, 봉인된 패(열쇠는 봉인하지 않는다)
    for(const t of bag){ if(!d&&!sl) break; if(d>0){ t.down=true; d--; } else if(t.k!==3){ t.seal=true; sl--; } }
    shuffle(bag,rng); spots.forEach((p,i)=>grid[p.y][p.x]=bag[i]);
  }while((!findMove()||(cfg.intro&&!teachMove()))&&++tries<400);
}
function dealBasket(){
  const pos=[]; for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)pos.push({x,y}); shuffle(pos);
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  // 종류마다 1단계 3·2단계 5·3단계 4·4단계 1장 = 셋씩 합치면 황금 패 한 장
  const bag=[]; for(let k=0;k<5;k++)[3,5,4,1].forEach((cnt,i)=>{ for(let j=0;j<cnt;j++)bag.push({k,l:i+1}); });

}

function splitKind(c){
  if(SETS[c]) return SETS[c].concat(0);
  let best=null;
  for(let d=0;d<=4;d++)for(let c3=0;c3<=8;c3++)for(let b=0;b<=16;b++){ const a=c-b-c3-d; if(a<0||a+2*b+4*c3+8*d!==32) continue;
    const sc=d*100+Math.abs(a-4)*3+c3; if(!best||sc<best.sc) best={sc,v:[a,b,c3,d]}; }
  return best?best.v:[0,0,0,4];
}
function genBag(T,rng,must=-1){
  let nk=T>=55?5:Math.max(1,Math.min(5,Math.round(T/14)));
  const kinds=shuffle([0,1,2,3,4],rng).slice(0,nk), bag=[]; if(must>=0&&!kinds.includes(must)) kinds[0]=must;
  kinds.forEach((k,i)=>{ const c=Math.floor(T/nk)+(i<T%nk?1:0); splitKind(c).forEach((cnt,l)=>{ for(let j=0;j<cnt;j++) bag.push({k,l:l+1}); }); });
  return bag;
}

finger.innerHTML=`<svg viewBox="0 0 48 60" aria-hidden="true"><path d="M17 57C10 50 5 42 7 36c1.5-4 6.5-4 8.5 0V10c0-6.5 9-6.5 9 0v17c2-4 9-3 9 2 2-3.5 8-2.5 8 2.5V44c0 6-3 10-6 13z" fill="${P}" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M24.5 27v8M33.5 29v7" fill="none" stroke="${K}" stroke-width="2" stroke-linecap="round"/></svg>`;

const nearRock=p=>{ for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const x=p.x+dx,y=p.y+dy; if(x<0||y<0||x>=COLS||y>=ROWS) continue; const g=grid[y][x]; if(g&&g.rock&&g.type!=='wall') return true; } return false; };
function movesAll(){
  const by={}, out=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const g=grid[y][x]; if(g&&!g.rock&&!g.down&&!g.seal)(by[g.k*10+g.l]||(by[g.k*10+g.l]=[])).push({x,y}); }
  for(const k in by){ const a=by[k]; for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++) if(findPath(a[i],a[j])) out.push([a[i],a[j]]); }
  return out;
}
/* ───────── 3.2: 장치(뒤집힌 패·봉인·잉크 얼룩), 목표, 난이도 곡선 ───────── */
const KN=['해','달','장미','열쇠','왕관'];
const INTRO={30:'down',60:'seal',90:'blot'}; // 새 장치가 처음 나오는 단계
const INTRO_TEXT={down:'뒤집힌 패 옆에서 합치면 앞면이 열립니다',seal:'봉인된 패 근처에서 열쇠 패를 합치면 풀립니다',blot:'잉크 얼룩은 세 번 합칠 때마다 번집니다. 옆에서 합쳐 지우세요'};
const isBoss=s=>s>GROW_END&&s%10===0&&!INTRO[s]; // 10단계마다 어려운 판
let coachOn=false, goldMade=0, kindMerge=[0,0,0,0,0];
const wallCount=()=>{ let n=0; for(const r of grid) for(const g of r) if(g&&g.rock&&g.type==='wall') n++; return n; };
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
// 합친 자리 둘레: 뒤집힌 패는 열리고, 열쇠를 합쳤다면(또는 폭발이면) 봉인이 풀린다
function freeNear(c,k,boom){
  let n=0; const R2=k===3?2:boom?1:0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const x=c.x+dx, y=c.y+dy; if(!inB(x,y)) continue; const g=grid[y][x]; if(!g||g.rock) continue;
    const d=Math.max(Math.abs(dx),Math.abs(dy));
    if(g.down&&d<=1){ g.down=false; n++; paint(x,y); R.bounce(x,y); }
    if(g.seal&&d<=R2){ g.seal=false; n++; paint(x,y); R.pulse(x,y); }
  }
  return n;
}
function freeAll(){ for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const g=grid[y][x]; if(g&&!g.rock&&(g.down||g.seal)){ g.down=false; g.seal=false; } } }
// 잉크 얼룩: 세 번 합칠 때마다 빈 옆 칸 하나로 번진다
function spreadBlot(){
  const c=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const g=grid[y][x]; if(g&&g.rock&&g.type==='blot') for(let d=0;d<4;d++){ const X=x+DX[d], Y=y+DY[d]; if(inB(X,Y)&&grid[Y][X]===null) c.push({x:X,y:Y}); } }
  if(!c.length) return; const p=c[rnd()*c.length|0]; grid[p.y][p.x]={rock:true,type:'blot'}; paint(p.x,p.y); R.pulse(p.x,p.y);
}
// 안내가 권할 만한 수: 그 자리에서 합치면 장치 하나가 풀리는가
function gainAt(p,k){
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){ const x=p.x+dx, y=p.y+dy; if(!inB(x,y)) continue; const g=grid[y][x]; if(!g) continue; const d=Math.max(Math.abs(dx),Math.abs(dy));
    if(d<=1&&((g.rock&&g.type!=='wall')||g.down)) return true; if(g.seal&&k===3) return true; }
  return false;
}
function teachMove(){ return movesAll().some(m=>{ const k=grid[m[0].y][m[0].x].k; return gainAt(m[0],k)||gainAt(m[1],k); }); }
function guide(){
  if((!tutOn&&!coachOn)||over||!grid.length){ finger.hidden=true; return; }
  const ms=movesAll(); if(!ms.length){ finger.hidden=true; return; }
  const kOf=p=>grid[p.y][p.x].k, same=(a,b)=>a.x===b.x&&a.y===b.y;
  let best=null; // 장치 옆 패가 '둘째'가 되는 순서를 먼저 권한다
  ms.forEach(([a,b])=>[[a,b],[b,a]].forEach(([p,q])=>{ const k=kOf(p), sc=(gainAt(q,k)?2:0)-(gainAt(p,k)?1:0); if(!best||sc>best.sc) best={sc,p,q}; }));
  if(coachOn&&best.sc<=0){ finger.hidden=true; return; }
  let t=best.p;
  if(sel){ const mine=ms.filter(m=>same(m[0],sel)||same(m[1],sel)).map(m=>same(m[0],sel)?m[1]:m[0]);
    if(mine.length){ const k=kOf(sel); t=mine.find(q=>gainAt(q,k))||mine[0]; if((goal.type==='rocks'||coachOn)&&gainAt(sel,k)&&!gainAt(t,k)) t=sel; } }
  finger.hidden=false; finger.style.left=((t.x+.5)*cw)+'px'; finger.style.top=((t.y+.62)*ch)+'px';
}
function goalMet(){
  const t=goal.type;
  return t==='clear'?tileCount()===0:t==='merge'?merges>=goal.n:t==='make'?madeMax>=goal.level:t==='rocks'?rockCount()===0:t==='boom'?booms>=goal.n
    :t==='gold'||t==='moves'?goldMade>=goal.n:t==='kind'?kindMerge[goal.k]>=goal.n:t==='walls'?wallCount()===0:false;
}
function hud(){
  const L=$('#goalL'), V=$('#goalV'), t=goal.type;
  if(t==='clear'){ L.textContent='남은 패'; V.textContent=tileCount(); }
  else if(t==='merge'){ L.textContent='같은 패 잇기'; V.textContent=Math.min(merges,goal.n)+'/'+goal.n; }
  else if(t==='make'){ L.textContent=goal.level+'단계 패 만들기'; V.textContent=(madeMax>=goal.level?1:0)+'/1'; }
  else if(t==='rocks'){ L.textContent='남은 덤불'; V.textContent=rockCount(); }
  else if(t==='boom'){ L.textContent='황금 폭발'; V.textContent=Math.min(booms,goal.n)+'/'+goal.n; }
  else if(t==='gold'){ L.textContent='황금 패(5단계) 만들기'; V.textContent=Math.min(goldMade,goal.n)+'/'+goal.n; }
  else if(t==='kind'){ L.textContent=KN[goal.k]+' 패 합치기'; V.textContent=Math.min(kindMerge[goal.k],goal.n)+'/'+goal.n; }
  else if(t==='walls'){ L.textContent='벽돌 다 깨기'; V.textContent=wallCount(); }
  else { L.textContent='황금 '+Math.min(goldMade,goal.n)+'/'+goal.n+' · 남은 이동'; V.textContent=Math.max(0,goal.limit-merges); }
}
// 16단계부터: 쉬움·쉬움·보통·어려움 반복, 10단계마다 어려운 판. 한 판에 장치는 두 종류까지
function stageCfg(s){
  if(s<=TUT_N) return Object.assign({tut:s},TUT[s-1]);
  if(s<=GROW_END){ const i=s-TUT_N-1, g=GROW[i], tiles=g[0]*g[1]-g[2]-g[3];
    return {cols:g[0],rows:g[1],wall:0,stone:g[3],bramble:g[2],limit:Math.round(tiles*(6-i/3))*1000}; }
  const c={wall:0,stone:0,bramble:0,down:0,seal:0,blot:0,goal:{type:'clear'}};
  if(INTRO[s]){ const d=INTRO[s]; c[d]=d==='blot'?2:3; c.limit=300000; c.intro=d; c.text=INTRO_TEXT[d]; return c; } // 첫 등장: 그 장치만 2~3개, 시간 넉넉
  const r=seeded(s*7919+13), T=Math.floor((s-16)/10), boss=isBoss(s), diff=boss?3:[0,0,1,2][(s-16)%4];
  const avail=['bramble']; if(s>=21) avail.push('stone'); if(s>=26) avail.push('wall'); if(s>30) avail.push('down'); if(s>60) avail.push('seal'); if(s>90) avail.push('blot');
  const picks=shuffle(avail,r).slice(0,2), total=Math.min(18,[4,7,10,13][diff]+Math.floor(T/2)), cap={bramble:10,stone:8,wall:6,down:10,seal:5,blot:3};
  picks.forEach(t=>{ c[t]=Math.max(1,Math.min(cap[t],Math.round(total/picks.length))); });
  c.limit=Math.max(110,[200,200,180,160][diff]-(boss?10:0)-T*3)*1000; c.diff=diff; c.boss=boss;
  const gr=r();
  if(diff>=2&&c.wall>0&&gr<.5){ c.wall=Math.min(c.wall,3); c.goal={type:'walls'}; }
  else if(gr<.45) c.goal={type:'clear'};
  else if(gr<.63) c.goal={type:'gold',n:2+Math.min(2,diff)};
  else if(gr<.85) c.goal={type:'kind',k:Math.floor(r()*5),n:6+diff};
  else c.goal={type:'moves',n:2,limit:[14,14,12,10][diff]};
  return c;
}

function leagueLeft(){ const k=new Date(Date.now()+9*3600e3), dow=(k.getUTCDay()+6)%7, ms=(7-dow)*86400e3-(k.getUTCHours()*3600e3+k.getUTCMinutes()*60e3+k.getUTCSeconds()*1e3);

/* ───────── 판 시작 / 종료 ───────── */
function startGame(m,stage){
  mode=m; jStage=stage||1; over=false; lock=false; paused=false; bombArmed=false; basket=[]; sel=null;
  score=0; combo=0; maxCombo=0; hints=0; gotStars=0; gotInk=0; subP=null; merges=madeMax=booms=0; hintsLeft=3; usedCont=false; clearWarn();
  lastMatch=-1e9; limit=0; setCombo(0); clearHint(); goal={type:'clear'}; tutOn=false; coachOn=false; goldMade=0; kindMerge=[0,0,0,0,0]; $('#hud').classList.remove('boss');
  $('#result').hidden=true; $('#resTable').hidden=false; $('#basket').hidden=m!=='basket'; show('game');
  fx.querySelectorAll('i').forEach(e=>e.remove()); pathLayer.textContent=''; // 지난 판의 이펙트가 남지 않게
  const coach=$('#coach'); coach.hidden=true;
  if(m==='journey'){
    const c=stageCfg(jStage); setSize(c.cols||8,c.rows||10); limit=c.limit||0; $('#hudStageL').textContent=c.boss?'어려운 판':'단계'; $('#hudStage').textContent=jStage;
    S.tries[jStage]=(S.tries[jStage]||0)+1; $('#hud').classList.toggle('boss',!!c.boss);
    if(c.tut){ tutOn=true; goal=c.goal; dealFixed(c.grid); coach.textContent=c.text; coach.hidden=false; }
    else { deal(c,rnd); goal=c.goal||{type:'clear'}; if(c.intro){ coachOn=true; coach.textContent=c.text; coach.hidden=false; }
      if(S.pending){ S.pending=0; if(boostTotal()<3){ const t=['shuffle','bomb'][rnd()*2|0]; S.boost[t]++; setTimeout(()=>toast('연승 보상: '+BN[t]+' +1',2200),300); } save(); } }
  } else if(m==='daily'){
    setSize(8,10); deal({wall:3,stone:3,bramble:4},seeded(+today().replace(/-/g,''))); $('#hudStageL').textContent='오늘의'; $('#hudStage').textContent='판';
  } else {
    setSize(8,10); dealBasket(); drawBasket(); $('#hudStageL').textContent='바구니'; $('#hudStage').textContent='7칸'; setTimeout(()=>toast('빈칸이나 가장자리에 닿은 패만 집을 수 있습니다',2600),300);
  }
  $('#timeCell').hidden=tutOn;
  tools(); layout(); paintAll(); hud(); startT=performance.now(); touch(); tick(); guide();
  if(m==='journey'&&!tutOn&&goal.type!=='clear') setTimeout(()=>toast('목표 · '+(goal.type==='moves'?goal.limit+'번 안에 황금 패 '+goal.n+'개':$('#goalL').textContent+(goal.n?' '+goal.n+(goal.type==='kind'?'번':'개'):'')),2400),350);
}
// 남은 시간 알림 (여정): 30초 예고, 10초부터 초읽기, 5초부터 판 테두리까지 붉게
let warnSec=1e9;
function timeWarn(sec){
  const t=$('#time'), w=$('#boardWrap');
  t.classList.toggle('low',sec<=30); t.classList.toggle('crit',sec<=10); w.classList.toggle('danger',sec<=5&&sec>0);
  const pulse=k=>t.animate({scale:[String(k),'1']},{duration:420,easing:'ease-out'});
  if(sec===30){ toast('30초 남았습니다',1300); pulse(1.5); sfx.bell(660,.13); buzz(30); }
  else if(sec===10){ toast('10초 남았습니다',1100); pulse(1.7); sfx.bell(880,.15); buzz([30,60,30]); }
  else if(sec<10&&sec>5){ pulse(1.3); sfx.tick(.12); }
  else if(sec<=5&&sec>0){ if(sec===5) toast('5초 남았습니다',800); pulse(1.9); sfx.tick(.24); buzz(45);
    w.animate({outlineWidth:['6px','3px']},{duration:500,easing:'ease-out'}); }
}
function clearWarn(){ warnSec=1e9; $('#time').classList.remove('low','crit'); $('#boardWrap').classList.remove('danger'); }
function tick(){
  if(over||paused) return;
  const el=elapsed();
  $('#time').textContent=fmtT(limit?limit-el:el);
  if(limit){ const sec=Math.ceil((limit-el)/1000); if(sec!==warnSec){ warnSec=sec; timeWarn(sec); } }
  if(limit&&el>=limit&&!lock){ if(mode==='journey'&&!usedCont) offerContinue(); else endGame(false,'시간이 다 되었습니다'); return; }
  // 5초 넘게 손이 멈추면 이어지는 쌍 하나가 살짝 반짝인다
  if(mode==='journey'&&!tutOn&&!coachOn&&!lock&&performance.now()-lastAct>5000){ const m=findMove(); if(m) R.glint(m); touch(); }
}
setInterval(tick,250);
function endGame(win,why){
  if(over) return; const t=elapsed(); over=true; lock=true; select(null); clearHint(); $('#boardWrap').classList.remove('danger');
  const tut=mode==='journey'&&jStage<=TUT_N, b=tut?{score:0,time:0,streak:0,combo:0,games:0,gold:0,cur:0}:S.rec[mode], was={score:b.score}, neu={};
  b.games++;
  if(win){
    b.cur++; if(mode==='journey'&&b.cur>=2) S.pending=1;
    if(score>b.score){ b.score=score; neu.score=1; }
    if(!b.time||t<b.time){ b.time=t; neu.time=1; }
    if(b.cur>b.streak){ b.streak=b.cur; neu.streak=1; }
    if(mode==='journey'){ if(jStage>S.jour){ gotInk=isBoss(jStage)?2:1; S.ink+=gotInk; if(jStage>TUT_N) leagueBump(); } S.jour=Math.max(S.jour,jStage); const fr=limit?(limit-t)/limit:1; gotStars=fr>=.6?3:fr>=.4?2:1; S.stars[jStage]=Math.max(S.stars[jStage]||0,gotStars); }
  } else b.cur=0;
  if(maxCombo>b.combo){ b.combo=maxCombo; neu.combo=1; }
  let dailyNote='';
  if(mode==='daily'&&win){ const d=today(); if(S.daily[d]) dailyNote='오늘 기록은 이미 남겼습니다'; else { S.daily[d]={score,time:t,combo:maxCombo,hints}; subP=sendDaily(); S.ink+=2; gotInk=2; } } // 하루 한 번 잉크 2
  if(mode==='journey') logStage(jStage,win,t,S.tries[jStage]||1,goal.type);
  save();
  setTimeout(()=>showResult(win,why||dailyNote,t,was,tut?{}:neu),win?550:350);
}
function showResult(win,msg,t,was,neu){
  const b=S.rec[mode]; win?sfx.win():sfx.bad();
  $('#resTitle').textContent=win?'판 완료':'패배';
  const notes=[]; if(msg) notes.push(msg);
  if(mode==='daily') notes.push('힌트 '+hints+'회'+(hints?' (+'+hints*10+'초)':'')); else if(win&&b.cur>=2) notes.push(b.cur+'연승');
  if(mode==='journey'&&win) notes.unshift(starStr(gotStars));
  if(gotInk) notes.push('\n잉크 +'+gotInk+' → 모은 잉크 '+S.ink+'\n판화 한 칸 = 잉크 '+INK_COST);
  $('#resMsg').textContent=notes.join(' · ').replace(' · \n','\n'); $('#resMsg').hidden=!notes.length;
  const row=(name,now,best,isNew)=>`<tr><td>${name}</td><td class="${isNew?'new':''}">${now}</td><td>${best}</td></tr>`;
  $('#resTable').innerHTML='<tr><th></th><th>이번</th><th>최고</th></tr>'

function seep(el,p,i,x,y){
  const g=el.querySelector('.rg[data-i="'+i+'"]'), svg=el.querySelector('svg'), id='sp'+(uid++), m=document.createElementNS(NS,'mask');
  m.id=id; m.setAttribute('maskUnits','userSpaceOnUse'); m.setAttribute('x',0); m.setAttribute('y',0); m.setAttribute('width',p.w); m.setAttribute('height',p.h);
  m.innerHTML=`<circle cx="${x}" cy="${y}" r="0" fill="#fff" filter="url(#${p.id}r)"/>`; svg.querySelector('defs').appendChild(m);

function setSkin(id){
  if(!SKINS[id]||!S.skins.includes(id)) return; S.skin=id; save(); skinVars(id);
  const fin=()=>{ if(S.skin!==id) return; buildTileCSS(); if(R.is3d) buildAtlas().then(cv=>{ if(S.skin!==id) return; R.setAtlas(cv); R.colors(); if(grid.length&&!over) paintAll(); }).catch(()=>{}); };
  if(SKINS[id].art&&!(window.SKIN_ART&&window.SKIN_ART[id])) loadSkinArt(id).then(fin); else fin();
}
function drawSkins(){
  const el=$('#skinRow'); if(!el) return; el.textContent='';
  Object.keys(SKINS).forEach(id=>{ const b=document.createElement('button'), has=S.skins.includes(id), h=HALLS.find(x=>x.skin===id); b.type='button';
    b.textContent=SKINS[id].name+(has?'':' · '+(h?h.id+'관 완성 시':'잠김')); b.disabled=!has; if(S.skin===id) b.className='armed'; b.setAttribute('aria-pressed',S.skin===id);
    b.onclick=()=>{ setSkin(id); drawSkins(); go('codex'); }; el.appendChild(b); });
}
let galHall=0, albHall=0, albNext=0;
function hangFig(p,cur){
  const f=document.createElement('figure'), has=S.paint.album.includes(p.id), now=PAINTS.indexOf(p)===cur;
  f.className='hang'+(now?' now':has?'':' lock'); f.innerHTML='<svg class="wire" viewBox="0 0 100 22" aria-hidden="true"><path d="M8 22 50 3 92 22" fill="none" stroke="#1B1714" stroke-width="1.6"/><circle cx="50" cy="3.5" r="3" fill="#1B1714"/></svg>';
  let pic; if(has||now){ pic=ptBuild(p,has?p.regions.map((r,j)=>j):paintDone(p)); pic.classList.add('framed'); } else { pic=document.createElement('div'); pic.className='pt lock'; pic.style.aspectRatio=p.w+' / '+p.h; pic.textContent='?'; }
  f.appendChild(pic); const c=document.createElement('figcaption'); c.textContent=has?p.title:now?p.title+' · 칠하는 중':'아직 못 본 판화'; f.appendChild(c);
  f.onclick=()=>{ if(now) go('paint'); else if(has){ albNext=p.hall||1; go('album'); } else toast('앞의 판화를 먼저 완성하세요',1500); };
  return {f,now};
}
function drawGallery(keep){
  const wall=$('#galWall'), cur=paintIdx(), fin=cur>=PAINTS.length;
  if(!keep||!galHall) galHall=(PAINTS[Math.min(cur,PAINTS.length-1)]||{}).hall||1;
  const hi=Math.max(0,HALLS.findIndex(h=>h.id===galHall)), H=HALLS[hi], list=hallList(H.id), got=list.filter(p=>S.paint.album.includes(p.id)).length;
  $('#galName').textContent=H.id+'관 · '+H.name+' · '+got+'/'+list.length+(got>=list.length?' ✓':''); $('#galPrev').disabled=hi<=0; $('#galNext').disabled=hi>=HALLS.length-1;
  wall.textContent=''; let nowEl=null; list.forEach(p=>{ const h=hangFig(p,cur); wall.appendChild(h.f); if(h.now) nowEl=h.f; });
  $('#menuInk').textContent='잉크 '+S.ink;
  $('#menuPaintHint').textContent=fin?'전시관 둘러보기 ›':S.ink>=INK_COST?'판화 칠하기 ›':'판화 칠하기 › 잉크 '+INK_COST+' 필요';
  $('#menuPaint').classList.toggle('can',!fin&&S.ink>=INK_COST); $('#menuPaint').onclick=()=>go(fin?'album':'paint');
  requestAnimationFrame(()=>{ const t=nowEl||wall.firstChild; if(t) wall.scrollLeft=Math.max(0,t.offsetLeft-(wall.clientWidth-t.offsetWidth)/2); });
}
$('#galPrev').onclick=()=>{ const i=HALLS.findIndex(h=>h.id===galHall); if(i>0){ galHall=HALLS[i-1].id; drawGallery(true); } };
$('#galNext').onclick=()=>{ const i=HALLS.findIndex(h=>h.id===galHall); if(i<HALLS.length-1){ galHall=HALLS[i+1].id; drawGallery(true); } };
function drawAlbum(){
  albHall=albNext||(curPaint()||{}).hall||1; albNext=0;
  const tabs=$('#albTabs'); tabs.textContent='';
  HALLS.forEach(h=>{ const b=document.createElement('button'); b.type='button'; b.textContent=h.id+'관'+(hallDone(h.id)?' ✓':''); if(h.id===albHall) b.className='armed'; b.onclick=()=>{ albNext=h.id; drawAlbum(); }; tabs.appendChild(b); });
  const H=HALLS.find(h=>h.id===albHall)||HALLS[0], list=hallList(H.id);
  $('#albName').textContent=H.name+(hallDone(H.id)?' · 완성'+(H.skin&&SKINS[H.skin]?' · 패 스킨 「'+SKINS[H.skin].name+'」 열림':''):' · '+list.filter(p=>S.paint.album.includes(p.id)).length+'/'+list.length+(H.skin&&SKINS[H.skin]?' · 완성하면 패 스킨 「'+SKINS[H.skin].name+'」':''));

  list.forEach(p=>{ const f=document.createElement('figure'), slot=document.createElement('div'), has=S.paint.album.includes(p.id); slot.className='slot';
    const pic=has?ptBuild(p,p.regions.map((r,i)=>i)):document.createElement('div');
    if(has) pic.classList.add('framed'); else { pic.className='pt lock'; pic.style.aspectRatio=p.w+' / '+p.h; pic.textContent='?'; }
    pic.style.width=(p.w>=p.h?76:76*p.w/p.h).toFixed(1)+'%'; slot.appendChild(pic); f.appendChild(slot);
    const c=document.createElement('figcaption'), b=document.createElement('b'), d=document.createElement('span'); b.textContent=has?p.title:'아직 칠하지 않은 판화'; d.textContent=has?p.by:''; c.appendChild(b); c.appendChild(d); f.appendChild(c);

}

// 공개용 키: 읽기와 하루 1회 등록만 허용되도록 테이블 쪽에서 막아 둔다
const SB_URL='https://kbogamdispdcnxfnusci.supabase.co', SB_KEY='sb_publishable_dcgZxLuI8Z9DftA1XpuRAg_WHmEJJTz', SB_TABLE='scm_daily_scores';
const within=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
const sb=(path,opt={})=>within(fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{})})),10000);
async function fetchBoard(){
  const r=await sb(SB_TABLE+'?select=nick,time_ms,hints&day=eq.'+today()+'&order=time_ms.asc,hints.asc&limit=20');
  if(!r.ok) throw {code:r.status};
  return (await r.json()).map(x=>({n:x.nick,t:x.time_ms,h:x.hints}));
}
// 하루 1회: (날짜, 기기) 가 기본 키라 두 번째 등록은 서버가 거절한다
async function submitDaily(rec){
  try{
    if(!S.pid){ S.pid=crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)); save(); }
    const r=await sb(SB_TABLE,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({day:today(),player_id:S.pid,nick:String(S.nick||'이름 없음').slice(0,12),time_ms:Math.max(1000,Math.round(rec.time)),hints:rec.hints||0,score:rec.score||0})});
    return r.ok||r.status===409?'ok':'fail';
  }catch(e){ return 'fail'; }
}
function sendDaily(){ const d=today(), r=S.daily[d]; if(!r||r.sent) return Promise.resolve(r?'ok':'off'); return submitDaily(r).then(st=>{ if(st==='ok'){ r.sent=1; save(); } return st; }); }
function retrySubmit(){ const r=S.daily[today()]; if(r&&!r.sent) sendDaily(); }
async function drawBoard(el,max,note){
  el.textContent=''; const say=t=>{ const p=document.createElement('p'); p.className='note'; p.textContent=t; el.appendChild(p); };
  say('오늘 순위를 불러오는 중');
  let rows; try{ rows=await fetchBoard(); }catch(e){ rows=undefined; }
  el.textContent='';
  if(rows===undefined){ say('오늘 순위를 불러오지 못했습니다'); return; }
  say('오늘 순위'+(note?' · '+note:''));
  if(!rows.length){ say('아직 기록이 없습니다'); return; }
  const tb=document.createElement('table'); tb.className='board';
  rows.slice(0,max).forEach((r,i)=>{ const tr=tb.insertRow(); [i+1,String(r.n||'이름 없음').slice(0,12),fmtT(r.t),'힌트 '+(+r.h||0)].forEach(v=>{ tr.insertCell().textContent=v; }); });
  el.appendChild(tb);
}
let recTab='journey';
function drawRec(){
  const b=S.rec[recTab], rows=[['최고 점수',fmtN(b.score)],['최단 클리어',b.time?fmtT(b.time):'–'],['최고 연승',b.streak],['총 판수',b.games],['최고 콤보','×'+Math.max(1,b.combo)],['황금 패 생성',b.gold]];
  $('#recList').innerHTML=rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  document.querySelectorAll('#recTabs button').forEach(x=>{ const on=x.dataset.tab===recTab; x.classList.toggle('armed',on); x.setAttribute('aria-pressed',on); });
}
document.querySelectorAll('#recTabs button').forEach(x=>{ x.onclick=()=>{ recTab=x.dataset.tab; drawRec(); }; });
document.querySelectorAll('#rankTabs button').forEach(x=>{ x.onclick=()=>{ rankTab=x.dataset.r; drawRank(); }; });
const SCREENS=['settings','coop','title','menu','map','records','codex','game','paint','album'];
function show(id){ SCREENS.forEach(s=>{ $('#'+s).hidden=s!==id; }); music(musicFor(id)); }
function go(id){
  $('#result').hidden=true; closeNote();

    $('#mCodex').textContent=Object.keys(S.seen).length+'/25';

  }

let titleDone=false, titleSkipAt=0; const titleTimers=[], titleAnims=[];
function buildTitle(){
  const IW=196, IH=192, IX=62, IY=13; // 해와 달 판화가 놓이는 자리
  const pic=`<image href="art/title.webp" x="${IX}" y="${IY}" width="${IW}" height="${IH}" preserveAspectRatio="none" style="-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%);mask-image:linear-gradient(90deg,transparent 0,#000 14%)"/>`;
  const key=`${pic}<g fill="none" stroke="${K}"><rect x="5" y="5" width="310" height="290" rx="3" stroke-width="2.6"/><rect x="10.5" y="10.5" width="299" height="279" rx="2" stroke-width="1.1"/></g>`
    +`<text x="160" y="250" text-anchor="middle" font-family="'Gowun Batang','Batang',serif" font-weight="700" font-size="44" letter-spacing="3" fill="${K}">사천성 머지</text>`
    +`<text x="160" y="277" text-anchor="middle" font-family="'IM Fell English','Gowun Batang',serif" font-style="italic" font-size="18" letter-spacing="1" fill="${K}">Shisen-Sho Merge</text>`;
  const svg=(id,cls,inner)=>`<svg class="${cls}" xmlns="${NS}" viewBox="0 0 320 300" preserveAspectRatio="none" aria-hidden="true"><defs>${inkFilter(id+'f',41,1.6,-7.9)}<mask id="${id}m" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="300"><circle cx="${IX+IW*.715}" cy="${IY+IH*.55}" r="${IW*.3}" fill="#fff"/><circle cx="${IX+IW*.63}" cy="${IY+IH*.535}" r="${IW*.265}" fill="#000"/></mask></defs>${inner}</svg>`;
  $('#plate').innerHTML=svg('pd','dry',key)+svg('pw','wet',key);
  // 색판 넷: 주홍(해) → 군청(달) → 황토(해의 얼굴) → 먹판
  $('#paper').innerHTML=svg('pp','',
    `<g class="pl" transform="translate(1.6 1.2)" filter="url(#ppf)"><circle cx="${IX+IW*.352}" cy="${IY+IH*.53}" r="${IW*.33}" fill="${KC[0]}"/></g>`
   +`<g class="pl" transform="translate(-1.3 1.4)" filter="url(#ppf)"><rect x="${IX}" y="${IY}" width="${IW}" height="${IH}" fill="${KC[1]}" mask="url(#ppm)"/></g>`
   +`<g class="pl" transform="translate(1.1 -1.2)" filter="url(#ppf)"><circle cx="${IX+IW*.365}" cy="${IY+IH*.535}" r="${IW*.14}" fill="${KC[4]}"/></g>`
   +`<g class="pl">${key}</g>`);
}
function finishTitle(){
  if(titleDone) return; titleDone=true;
  titleTimers.forEach(clearTimeout); titleAnims.forEach(a=>{ try{ a.cancel(); }catch(e){} });
  $('#plate').style.opacity=0; $('#roller').style.opacity=0; $('#paper').style.opacity=1;
  document.querySelectorAll('#paper .pl').forEach(g=>{ g.style.opacity=1; });
  const b=$('#btnStart'); b.style.opacity=1; b.style.pointerEvents='auto';
}
function runTitle(){
  buildTitle();
  const press=$('#press'), plate=$('#plate'), paper=$('#paper'), roller=$('#roller'), btn=$('#btnStart'), wet=plate.querySelector('.wet');
  btn.style.opacity=0; btn.style.pointerEvents='none';
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){ finishTitle(); return; }
  const an=(el,k,o)=>{ const a=el.animate(k,Object.assign({fill:'both'},o)); titleAnims.push(a); return a; };
  const at=(ms,fn)=>titleTimers.push(setTimeout(()=>{ if(!titleDone) fn(); },ms));
  // 1. 잉크 롤러가 판을 지나며 먹을 올린다
  an(roller,{left:['-16%','106%']},{duration:850,easing:'ease-in-out'});
  an(wet,{clipPath:['inset(0 100% 0 0)','inset(0 0% 0 0)']},{duration:850,easing:'ease-in-out'});
  an(roller,{opacity:[1,0]},{duration:160,delay:860});
  at(60,()=>hiss(0,.7,.1,1800));
  // 2. 종이를 덮고 누른다
  an(paper,{opacity:[0,1,1],translate:['0 -70%','0 -8%','0 0'],rotate:['-4deg','-1.2deg','0deg']},{duration:500,delay:900,easing:'ease-in'});
  an(press,{scale:['1','.955','1']},{duration:280,delay:1400,fill:'none'});
  at(1430,()=>{ knock(90,0,.35,.25); buzz(30); });
  // 3. 들어 올리면 색판이 네 번 겹쳐 찍힌다
  an(plate,{opacity:[1,0]},{duration:200,delay:1700});
  an(paper,{translate:['0 0','0 -7%','0 0'],scale:['1','1.035','1']},{duration:420,delay:1720,fill:'none',easing:'ease-out'});
  document.querySelectorAll('#paper .pl').forEach((g,i)=>{ const t=1900+i*470;
    an(g,{opacity:[0,1]},{duration:80,delay:t});
    an(paper,{scale:['1','.972','1']},{duration:210,delay:t,fill:'none'});
    at(t,()=>{ knock(i===3?105:150+i*22,0,.3,.16); buzz(20); }); });
  an(btn,{opacity:[0,1]},{duration:300,delay:3700});
  at(4050,finishTitle);
}
